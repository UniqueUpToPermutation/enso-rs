[package]
name = "enso-visual"
description = "GPU renderer for enso: shared resources plus pluggable subrenderers."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
bytemuck.workspace = true
fdsm.workspace = true
glam.workspace = true
# fdsm writes distance fields into `image` buffers (also used by golden tests).
image.workspace = true
log.workspace = true
pollster.workspace = true
thiserror.workspace = true
ttf-parser.workspace = true
wgpu.workspace = true

[dev-dependencies]
env_logger.workspace = true
winit.workspace = true

# Every example is also built as a test (`test = true`), so `cargo test` runs
# the golden-image check inside it. tests/examples_have_golden_tests.rs
# fails if an example is missing from this list.
[[example]]
name = "static_mesh"
test = true

[[example]]
name = "sky"
test = true

[[example]]
name = "tentacles"
test = true

[[example]]
name = "notes"
test = true

[[example]]
name = "text"
test = true

[[example]]
name = "sprites"
test = true
