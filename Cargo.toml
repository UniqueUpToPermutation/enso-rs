# Workspace manifest. This file has no code of its own; it groups the crates
# under `crates/` so they share one Cargo.lock, one target/ dir, and one set
# of dependency versions.
[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

# Metadata that member crates inherit with `edition.workspace = true`, etc.
[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

# Every external dependency is versioned once, here. Member crates opt in with
# `wgpu.workspace = true`. Keep wgpu/winit aligned with what egui-wgpu expects.
[workspace.dependencies]
enso-core = { path = "crates/enso-core" }
enso-io = { path = "crates/enso-io" }
enso-audio = { path = "crates/enso-audio" }
enso-block = { path = "crates/enso-block" }
enso-block-derive = { path = "crates/enso-block-derive" }
enso-visual = { path = "crates/enso-visual" }
enso-ui = { path = "crates/enso-ui" }
# Vendored and ported to egui 0.37 (see third_party/README.md).
egui-snarl = { path = "third_party/egui-snarl" }

# Procedural macros (enso-block-derive). syn 2: already in the tree via
# other dependencies; "full" parses arbitrary expressions in attributes.
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

wgpu = "30.0"
# egui 0.37: the version whose egui-wgpu uses wgpu 30 (our renderer's).
# eframe's default features use the wgpu backend.
egui = "0.37"
eframe = "0.37"
winit = "0.30"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1.0"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
# Text: font parsing and multi-channel signed distance field generation.
ttf-parser = "0.25"
fdsm = "0.8"
# MIDI devices (WinMM on Windows, CoreMIDI, ALSA).
midir = "0.11"
# Lock-free single-producer/single-consumer ring buffer: the only way data may
# reach the audio thread, which must never wait on a lock.
rtrb = "0.3"
# Bounded lock-free multi-producer queue: MIDI from any number of input
# threads into the audio thread.
crossbeam-queue = "0.3"
# Block identity: random v4 for roots, deterministic v5 for children.
uuid = { version = "1", features = ["v4", "v5"] }
# Audio devices on every desktop OS (WASAPI, CoreAudio, ALSA/PipeWire).
cpal = "0.18"
# Tests only: abort if the audio path allocates.
assert_no_alloc = "1.1"
# PNG only: the full default feature set compiles a dozen codecs.
image = { version = "0.25", default-features = false, features = ["png"] }

# Optimise dependencies even in debug builds: wgpu, naga and (later) the DSP
# code are painfully slow unoptimised, while our own crates stay fast to build.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = true # keep symbols so release builds can be profiled
